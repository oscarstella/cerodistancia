<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Tienda | CeroDistancia</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=2.0">

  <style>
    .form-box-create {
      background: var(--dark-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 36px 30px;
      max-width: 600px;
      margin: 30px auto;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .form-control-dark {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: #fff !important;
      border-radius: 12px;
      padding: 12px 16px;
    }

    .form-control-dark:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }
  </style>
</head>

<body>

  <!-- GLOW EFFECTS -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark navbar-custom sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <a href="panel.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
          <i class="bi bi-arrow-left"></i> Volver a mi Panel
        </a>
      </div>

      <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="index.html">
        <span class="p-1 rounded-2 bg-dark border border-secondary border-opacity-25 shadow-sm d-inline-flex">
          <i class="bi bi-lightning-charge-fill text-success"></i>
        </span>
        <span class="brand-badge fs-5">CeroDistancia</span>
      </a>

      <div></div>
    </div>
  </nav>

  <div class="container py-4 position-relative" style="z-index: 1;">
    <div class="form-box-create">
      <div class="text-center mb-4">
        <span class="section-badge">Paso Inicial</span>
        <h3 class="fw-bold text-white mb-2">Crear nueva tienda</h3>
        <p class="text-muted small">Definí los datos iniciales. Recordá que luego podés cambiar logo, portada y fotos las veces que quieras.</p>
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small">Nombre de la tienda *</label>
        <input id="nombre" type="text" class="form-control form-control-dark" placeholder="Ej: Pizzería Bella Napoli">
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small">Descripción breve *</label>
        <textarea id="descripcion" class="form-control form-control-dark" rows="2" placeholder="Ej: Especialistas en pizzas a la piedra y empanadas"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small">¿Quiénes somos? / Historia (Opcional)</label>
        <textarea id="quienes" class="form-control form-control-dark" rows="2" placeholder="Contá tu historia, especialidad o presentación"></textarea>
      </div>

      <div class="mb-4">
        <label class="form-label text-muted small">Logo o Imagen de portada (Opcional)</label>
        <input id="logo" type="file" accept="image/*" class="form-control form-control-dark">
      </div>

      <button id="crearBtn" class="btn-primary-action w-100 justify-content-center py-3">
        <i class="bi bi-rocket-takeoff"></i>
        <span>Crear tienda y continuar</span>
      </button>

      <p id="msg" class="mt-3 text-danger fw-semibold text-center small mb-0"></p>
    </div>
  </div>

  <script>
    document.getElementById("crearBtn").addEventListener("click", async () => {
      const nombre = document.getElementById("nombre").value.trim();
      const descripcion = document.getElementById("descripcion").value.trim();
      const quienes = document.getElementById("quienes").value.trim();
      const logo = document.getElementById("logo").files[0];

      if (!nombre) {
        document.getElementById("msg").innerText = "El nombre es obligatorio.";
        return;
      }

      if (!descripcion) {
        document.getElementById("msg").innerText = "La descripción es obligatoria.";
        return;
      }

      const uid = localStorage.getItem("uid");
      const email = localStorage.getItem("email");
      if (!uid) {
        alert("Error: no hay usuario logueado.");
        return;
      }

      const formData = new FormData();
      formData.append("uid", uid);
      formData.append("email", email);
      formData.append("nombre", nombre);
      formData.append("descripcion", descripcion);
      formData.append("quienes", quienes);

      if (logo) formData.append("logo", logo);

      const res = await fetch("backend/crear_tienda.php", {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      if (data.ok) {
        window.location.href = "panel.html";
      } else {
        document.getElementById("msg").innerText = data.error || "No se pudo guardar la tienda.";
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
