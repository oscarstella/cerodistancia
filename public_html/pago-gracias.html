<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pago confirmado | CeroDistancia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow-sm">
        <div class="card-body text-center p-4">

          <div id="estadoCargando">
            <div class="spinner-border text-success mb-3"></div>
            <h5 class="fw-bold">Confirmando tu pago...</h5>
            <p class="text-muted">Activando tu tienda, esperá un momento.</p>
          </div>

          <div id="estadoOk" class="d-none">
            <h4 class="fw-bold text-success">🎉 ¡Tu tienda está activa!</h4>
            <p class="mt-3">Ya podés recibir pedidos por WhatsApp.</p>

            <a id="btnIrTienda" href="#" class="btn btn-success mt-3 fw-bold">
              Ir a mi tienda
            </a>
          </div>

          <div id="estadoError" class="d-none">
            <h5 class="fw-bold text-danger">⚠️ No pudimos activar la tienda</h5>
            <p class="text-muted mt-2">
              Contactanos para verificar el pago.
            </p>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="pago-gracias.js"></script>
</body>
</html>
