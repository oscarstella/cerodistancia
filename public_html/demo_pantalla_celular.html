<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Mockup Celular CeroDistancia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    body {
      background: #0b0f17;
      color: white;
      padding: 50px 20px;
      font-family: sans-serif;
    }

    /* CONTENEDOR HERO MOCKUP */
    .mockup-container {
      position: relative;
      max-width: 600px;
      margin: auto;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    }

    .mockup-base-img {
      width: 100%;
      height: 480px;
      object-fit: cover;
      display: block;
    }

    /* PANTALLA DEL CELULAR QUE TIENE EN LA MANO */
    .screen-overlay {
      position: absolute;
      top: 36.5%;
      left: 36.2%;
      width: 69px;
      height: 140px;
      background: #0f172a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
    }

    .screen-header {
      background: #10b981;
      padding: 3px 4px;
      font-size: 8px;
      font-weight: 800;
      color: white;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .screen-content {
      flex: 1;
      padding: 4px;
      overflow: hidden;
      position: relative;
    }

    /* SCROLL ANIMADO DEL CATÁLOGO */
    .catalog-scroll {
      animation: scrollCatalog 8s ease-in-out infinite;
    }

    @keyframes scrollCatalog {
      0%, 20% { transform: translateY(0); }
      40%, 60% { transform: translateY(-50px); }
      80%, 100% { transform: translateY(0); }
    }

    .mini-card {
      background: #1e293b;
      border-radius: 4px;
      padding: 3px;
      margin-bottom: 4px;
      font-size: 7px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .mini-img {
      width: 18px;
      height: 18px;
      background: #334155;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
    }

    .mini-btn {
      background: #10b981;
      color: white;
      border: none;
      font-size: 6px;
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 700;
      margin-top: 2px;
    }

    .mini-cart-btn {
      background: #25d366;
      color: white;
      padding: 2px;
      text-align: center;
      font-size: 7px;
      font-weight: 700;
      border-radius: 4px;
      margin-top: 2px;
      animation: pulseBtn 2s infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <div class="container text-center">
    <h2 class="fw-bold mb-2 text-success">Demostración: Celular con pantalla animada de CeroDistancia</h2>
    <p class="text-muted mb-4">La pantalla que el comerciante sostiene reproduce la tienda real con scroll dinámico de productos y pedido por WhatsApp.</p>

    <div class="mockup-container">
      <img src="img/propuesta_opcion1.jpg" class="mockup-base-img" alt="Comerciante CeroDistancia">

      <!-- PANTALLA ACTIVA CON CERODISTANCIA -->
      <div class="screen-overlay">
        <div class="screen-header">
          <i class="bi bi-lightning-charge-fill"></i>
          <span>CeroDistancia</span>
        </div>

        <div class="screen-content">
          <div class="catalog-scroll">
            <div class="mini-card">
              <div class="mini-img">🥖</div>
              <div>
                <div style="font-weight:700;">Pan Masamadre</div>
                <div style="color:#10b981;">$1.200</div>
              </div>
            </div>

            <div class="mini-card">
              <div class="mini-img">🥐</div>
              <div>
                <div style="font-weight:700;">Croissant París</div>
                <div style="color:#10b981;">$950</div>
              </div>
            </div>

            <div class="mini-card">
              <div class="mini-img">☕</div>
              <div>
                <div style="font-weight:700;">Café Espresso</div>
                <div style="color:#10b981;">$800</div>
              </div>
            </div>

            <div class="mini-cart-btn">
              <i class="bi bi-whatsapp"></i> Pedir
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
